[project]
name = "substrate"
version = "0.1.0"
description = "Local-first intelligence layer for AI agents: persistent memory, file intelligence, task orchestration, and safe tool execution over MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Substrate contributors" }]
keywords = ["mcp", "ai-agents", "memory", "local-first", "safety"]
dependencies = []

[project.optional-dependencies]
# Optional accelerators — the daemon runs fully without them (deterministic
# hashing embedder + stdlib fallbacks are used when these are absent).
embeddings = ["fastembed>=0.3"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
substrate = "substrate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/substrate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
